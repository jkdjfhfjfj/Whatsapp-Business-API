kind = "web"
previewPath = "/"
title = "WhatsApp Business API"
description = "A WhatsApp Business support workspace for managing conversations, customer media, bots, and webhook-connected messaging."
version = "1.0.0"
id = "artifacts/whatsapp-platform"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19852

[services.development]
run = "pnpm --filter @workspace/whatsapp-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/whatsapp-platform", "run", "build" ]
serve = "static"
publicDir = "artifacts/whatsapp-platform/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19852"
BASE_PATH = "/"
