services:
  - type: web
    name: whatsapp-business-api
    runtime: node
    buildCommand: corepack enable && npm run build && npm run push:db
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # This key encrypts stored Meta/Groq credentials. It is not used for browser authentication.
      - key: SESSION_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: DEFAULT_BUSINESS_NAME
        value: WhatsApp Support
      - key: STORAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false